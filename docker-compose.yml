services:
  hermes-agent:
    container_name: hermes
    restart: unless-stopped
    volumes:
      - /home/b/hermes:/opt/data
    ports:
      - 8642:8642
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=$(openssl rand -hex 32)
      - API_SERVER_CORS_ORIGINS=*
      - TZ=Asia/Jakarta
      - LANG=en_US.UTF-8
    image: nousresearch/hermes-agent
    command: gateway run
    networks:
      - hermes-net
      
networks:
  hermes-net:
    driver: bridge
